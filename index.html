<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SULTANAT APP - LIVE</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:system-ui} .header{background:linear-gradient(135deg,#4a00e0,#8e2de2);padding:18px;text-align:center;position:sticky;top:0} .tabs{display:flex;background:#1a1a1a} .tab{flex:1;padding:14px;text-align:center;font-size:13px;cursor:pointer;opacity:.6} .tab.active{opacity:1;border-bottom:3px solid #8e2de2} .card{background:#1e1e1e;margin:12px;border-radius:16px;padding:16px;border:1px solid #2a2a2a} .btn{width:100%;background:linear-gradient(135deg,#4a00e0,#8e2de2);border:0;color:#fff;padding:14px;border-radius:12px;font-weight:bold;margin-top:10px} .score{display:flex;justify-content:space-between;background:#151515;padding:10px;border-radius:10px;margin:6px 0;font-size:13px}</style></head><body>
<div class="header"><h1>👑 SULTANAT APP</h1><p>● LIVE • Wazir • Voting Active</p></div>
<div class="tabs"><div class="tab active" onclick="show('home')">Home</div><div class="tab" onclick="show('wazir')">Wazir</div><div class="tab" onclick="show('vote')">Vote</div><div class="tab" onclick="show('profile')">Profile</div></div>
<div id="home" class="page"><div class="card"><h3>🏆 Score Formula</h3><div class="score"><span>Voting</span><b>50%</b></div><div class="score"><span>Referral</span><b>30%</b></div><div class="score"><span>Active Time</span><b>20%</b></div><div class="score" style="border:1px dashed #ff69b4"><span>Female Bonus</span><b>+10%</b></div></div></div>
<div id="wazir" class="page" style="display:none"><div class="card"><h3>👑 Wazir YouTube (FREE)</h3><input id="yt" placeholder="Unlisted YouTube Link" style="width:100%;padding:12px;border-radius:10px;background:#111;color:#fff;border:1px solid #333;margin:8px 0"><button class="btn" onclick="alert('Video LIVE! '+document.getElementById('yt').value)">+ Add Video</button></div></div>
<div id="vote" class="page" style="display:none"><div class="card"><button class="btn" onclick="this.innerText='✅ Voted!'">Candidate A ko Vote</button><button class="btn" style="background:#333;margin-top:8px" onclick="this.innerText='✅ Voted!'">Candidate B ko Vote</button><p style="margin-top:10px;font-size:12px">Referral Link: <b style="color:#a970ff">sultanat.app/r/azhan123</b></p></div></div>
<div id="profile" class="page" style="display:none"><div class="card" style="text-align:center"><h3>Azhan Khan</h3><p>Score: 340 | Referrals: 12</p></div></div>
<script>function show(id){document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).style.display='block';event.target.classList.add('active')}</script>
</body></html>
